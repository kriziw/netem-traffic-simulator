[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netem-traffic-simulator"
dynamic = ["version"]
description = "Corporate endpoint traffic simulation and digital experience measurement companion for NetEm WAN Lab"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "Flask==3.1.2",
  "locust==2.46.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["trafficgen*"]

[tool.setuptools.package-data]
trafficgen = ["version.txt", "templates/*.html", "static/*"]

[tool.setuptools.dynamic]
version = {file = "version.txt"}
