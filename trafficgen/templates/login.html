<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · NetEm Traffic Simulator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="brand login-brand">
      <div class="brand-mark">NT</div>
      <div><div class="brand-name">Traffic Simulator</div><div class="brand-sub">NetEm companion</div></div>
    </div>
    <h1>Administrator access</h1>
    <p>Use the administrator password generated during installation.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post" action="{{ url_for('login_post', next=request.args.get('next')) }}">
      <label>Password</label>
      <input type="password" name="password" autofocus required>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
